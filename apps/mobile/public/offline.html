<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f3b34" />
    <title>PersoCare Mobile Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #f7f8f6, #eef4f0);
        color: #0f3b34;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: white;
        border: 1px solid #d9e5de;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 59, 52, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #4a5852;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You&apos;re offline</h1>
      <p>
        PersoCare Mobile will reconnect when your network is back.
        Cached pages may still be available while you are offline.
      </p>
    </div>
  </body>
</html>
